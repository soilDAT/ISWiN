[build-system]
requires = ["setuptools>=64.0","wheel", "setuptools_scm>=8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "iswin"
dynamic = ["version"]
authors = [
    {name="Caleb Fried", email="cbfried@uw.edu"},
    {name="Amy Rude",email="amysrude@uw.edu"},
    {name="Lila Perkins",email="lfdp@uw.edu"},
    {name="Adity Rani", email="adity@uw.edu"}
]
description = ["A tool to acquire soil moisture from iNaturalist photos."]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.25"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

[project urls]
Homepage = "https://github.com/soilDAT/ISWiN"
Issues = "https://github.com/soilDAT/ISWiN/issues"

[tool.setuptools_scm]